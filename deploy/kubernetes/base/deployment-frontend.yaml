apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowatch-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cowatch-frontend
  template:
    metadata:
      labels:
        app: cowatch-frontend
    spec:
      containers:
      - name: frontend
        image: cowatch-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
