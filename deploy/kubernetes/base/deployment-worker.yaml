apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowatch-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cowatch-worker
  template:
    metadata:
      labels:
        app: cowatch-worker
    spec:
      containers:
      - name: worker
        image: cowatch-worker:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: cowatch-config
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"
