apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cowatch-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cowatch-backend-svc"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cowatch.example.com
    secretName: cowatch-tls
  rules:
  - host: cowatch.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cowatch-backend-svc
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cowatch-frontend-svc
            port:
              number: 80
